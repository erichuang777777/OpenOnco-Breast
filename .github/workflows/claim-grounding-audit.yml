name: KB claim-grounding audit

# Periodic audit of claim-bearing KB prose: do clinical assertions on
# Indication/Regimen/BMA entities cite a SRC-* anchor? Implements Q4+Q5 of
# docs/plans/kb_data_quality_plan_2026-04-29.md.
#
# Default mode: detection-only (no API calls, no secret needed). Forks
# without an ANTHROPIC_API_KEY get a useful coverage report each Monday.
# Manual workflow_dispatch supports an opt-in semantic grounding pass
# (calls the Claude API; consumes ~$5-15 per full run).
#
# When the report changes, the workflow commits the refreshed
# `docs/kb-claim-grounding-report.md` + `.json` straight back to master.
# We mirror the daily-site-refresh.yml pattern (regenerate → diff →
# commit) rather than opening a PR: the report is a generated audit
# artifact under docs/, not clinical content under
# knowledge_base/hosted/content/, so CHARTER §6.1 two-reviewer signoff
# does not apply. The audit is a measurement, not a gate — no clinical
# decision is made here.
#
# History: this step used peter-evans/create-pull-request until
# 2026-07-30. Every scheduled run failed at PR creation with "GitHub
# Actions is not permitted to create or approve pull requests" (repo
# setting Settings → Actions → General → Workflow permissions), after
# having already pushed a `kb-claim-grounding-refresh-<run_id>` branch —
# so the job went red weekly and leaked one orphan branch per run.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      semantic:
        description: "Run semantic check (requires ANTHROPIC_API_KEY secret; ~$5-15 cost)"
        type: boolean
        default: false
      limit:
        description: "Cap entities checked (smoke runs); leave blank for full audit"
        required: false

# Only one audit at a time — prevents a manual trigger racing the
# scheduled run for the push to master.
concurrency:
  group: claim-grounding-audit
  cancel-in-progress: false

permissions:
  contents: write  # need push back to master

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pydantic
          if [ "${{ github.event.inputs.semantic }}" = "true" ]; then
            pip install 'anthropic>=0.40,<1.0'
          fi

      - name: Run audit (detection or semantic)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.semantic }}" = "true" ]; then
            if [ -z "$ANTHROPIC_API_KEY" ]; then
              echo "::warning::semantic requested but ANTHROPIC_API_KEY missing — falling back to detection-only"
            else
              ARGS="$ARGS --semantic"
            fi
          fi
          # shellcheck disable=SC2086
          python -m scripts.audit_claim_grounding $ARGS

      - name: Detect report changes
        id: diff
        run: |
          if git diff --quiet -- docs/kb-claim-grounding-report.md docs/kb-claim-grounding-report.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push refreshed report
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "openonco-kb-audit[bot]"
          git config user.email "kb-audit@openonco.info"
          git add docs/kb-claim-grounding-report.md docs/kb-claim-grounding-report.json
          git commit -m "chore(kb): refresh claim-grounding audit report" -m "$(cat <<'EOF'
          Automated refresh of the KB claim-anchor grounding report.

          See docs/kb-claim-grounding-report.md for the human-readable
          summary and docs/kb-claim-grounding-report.json for the
          structured payload. This is an audit, not a gate — no quality
          decisions are made here. Tracks Q4 + Q5 of
          docs/plans/kb_data_quality_plan_2026-04-29.md.

          Triggered by .github/workflows/claim-grounding-audit.yml
          EOF
          )"
          # master may have moved (daily-site-refresh also pushes docs/).
          # Rebase onto it rather than failing the run.
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "✓ Claim-grounding report refreshed and pushed to master."
          else
            echo "✓ No changes — report already in sync with KB."
          fi
