# Monthly CIViC snapshot refresh.
#
# Cron: 06:00 UTC on the 1st of every month. Manual trigger via
# workflow_dispatch is also supported (useful for one-off backfills /
# debugging). The workflow:
#
#   1. Downloads the CIViC nightly TSV (CC0-licensed, free to mirror).
#   2. Runs knowledge_base/ingestion/civic_loader.py to materialise a
#      new snapshot under knowledge_base/hosted/civic/<today>/.
#   3. Diffs the new snapshot against the most recent prior snapshot,
#      writing a markdown summary into the same dated directory.
#   4. Pushes the new snapshot + diff summary to a
#      `civic-refresh-<run_id>` branch and prints the "open a PR" link
#      in the job summary. A human opens the PR from that branch.
#
# Two-reviewer signoff required per CHARTER §6.1 before merge —
# drift in CIViC evidence levels, directions, or therapy lists can
# affect engine-driven clinical recommendations, so a clinician must
# read the diff summary before this snapshot reaches master. That is
# why this workflow does NOT commit straight to master the way
# daily-site-refresh.yml and claim-grounding-audit.yml do: those write
# generated artifacts under docs/, this one writes clinical evidence
# data.
#
# History: step 4 used peter-evans/create-pull-request until
# 2026-07-30. The action pushes the branch fine but then fails with
# "GitHub Actions is not permitted to create or approve pull requests"
# (repo setting Settings → Actions → General → Workflow permissions),
# turning the whole run red after the useful work was already done.
# Pushing the branch and letting a human open the PR keeps the
# clinical-review gate intact without depending on that setting. If
# the setting is ever enabled, the PR-creation step can come back.
#
# Notes:
# - The branch is pushed to origin; the PR is opened against master.
# - GITHUB_TOKEN is auto-provided by Actions; no extra secrets needed.

name: CIViC monthly refresh

on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write  # push the refresh branch; no PR is created here

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml httpx

      - name: Run refresh
        id: refresh
        run: |
          python scripts/refresh_civic.py
          # Locate the diff_summary.md just written (latest dated dir).
          latest_dir=$(ls -1d knowledge_base/hosted/civic/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9] | sort | tail -n 1)
          echo "latest_dir=$latest_dir" >> "$GITHUB_OUTPUT"
          echo "diff_path=$latest_dir/diff_summary.md" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push refresh branch for clinical review
        if: steps.diff.outputs.changed == 'true'
        env:
          BRANCH: civic-refresh-${{ github.run_id }}
        run: |
          git config user.name  "openonco-civic-refresh[bot]"
          git config user.email "civic-refresh@openonco.info"
          git checkout -b "$BRANCH"
          git add knowledge_base/hosted/civic
          git commit -m "chore(civic): refresh nightly snapshot — awaiting clinical review"
          git push origin "$BRANCH"

      - name: Summary
        if: always()
        env:
          BRANCH: civic-refresh-${{ github.run_id }}
        run: |
          if [ "${{ steps.diff.outputs.changed }}" != "true" ]; then
            echo "✓ No CIViC drift this month — nothing to review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## CIViC monthly refresh — needs clinical review"
            echo
            echo "Snapshot pushed to branch \`$BRANCH\`."
            echo
            echo "**Open the PR:** ${{ github.server_url }}/${{ github.repository }}/compare/master...$BRANCH?expand=1"
            echo
            echo "Label it \`civic-refresh\` + \`needs-clinical-review\`. Two Clinical"
            echo "Co-Lead approvals required before merge (CHARTER §6.1)."
            echo
            echo "### Diff summary"
            echo
            cat "${{ steps.refresh.outputs.diff_path }}"
          } >> "$GITHUB_STEP_SUMMARY"
